<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arena Test</title>
<link rel="icon" href="data:," />
<style>
  html, body { margin: 0; height: 100%; background: #07080a; color: #e8e8e8; font: 13px system-ui, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #hud { position: fixed; left: 10px; top: 10px; background: rgba(0,0,0,.55); padding: 6px 9px; border-radius: 6px; line-height: 1.5; pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">loading arena...</div>
<script type="module">
// Developer page: renders only the arena (Renderer + Arena), plus two real Rocketbox avatars and balls for scale.
// URL params:
//   quality=low|medium|high   view=orbit|player|side|stands|top|end   speed=<orbit rad/s>   avatars=0 to hide people
//   pulse=<type>  (repeats every 2 s)   sustain=<type>  (danger|freeze|rewind held at 1)   stats=0 hides the overlay
// Keys: 1..7 fire pulses (hit heavyHit perfectCatch ultimate freeze rewind danger), V cycles views.
import * as THREE from 'three';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { game } from '../js/game.js';
import { Assets } from '../js/engine/assets.js';
import { Renderer } from '../js/render/renderer.js';
import { Arena } from '../js/world/arena.js';
import { TEAM } from '../js/core/constants.js';

const params = new URLSearchParams(location.search);
const quality = ['low', 'medium', 'high'].includes(params.get('quality')) ? params.get('quality') : 'high';
game.config = { ...game.config, quality, params };
const hud = document.getElementById('hud');
if (params.get('stats') === '0') hud.style.display = 'none';

const renderer = new Renderer(document.getElementById('app'), quality);
game.renderer = renderer; game.scene = renderer.scene; game.camera = renderer.camera;
game.assets = new Assets(renderer.three);
game.assets.base = '../assets/';
await game.assets.loadManifest();

const t0 = performance.now();
const arena = new Arena();
await arena.build(game.scene);
game.arena = arena; game.court = arena.court;
const buildMs = Math.round(performance.now() - t0);

// ---- real avatars + balls for scale / lighting reference (never procedural bodies)
const mixers = [];
async function addAvatar(heroId, pos, yaw) {
  const def = game.assets.manifest.heroes[heroId];
  if (!def) return;
  const g = await game.assets.gltf(def.folder + def.model);
  const model = SkeletonUtils.clone(g.scene);
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const out = mats.map((m) => {
      const spec = def.materials[m.name] || {};
      const mat = new THREE.MeshPhysicalMaterial({ name: m.name, roughness: 1, metalness: 0 });
      if (spec.map) mat.map = game.assets.texture(def.folder + spec.map, true);
      if (spec.normalMap) mat.normalMap = game.assets.texture(def.folder + spec.normalMap, false);
      if (spec.ormMap) mat.roughnessMap = game.assets.texture(def.folder + spec.ormMap, false);
      if (spec.kind === 'skin') { mat.sheen = 0.25; mat.sheenRoughness = 0.6; mat.sheenColor = new THREE.Color(0.9, 0.55, 0.45); }
      if (spec.kind === 'hair') { mat.alphaTest = spec.alphaTest || 0.35; mat.side = THREE.DoubleSide; }
      if (/helmet|knife/.test(m.name)) mat.visible = false;
      return mat;
    });
    o.material = Array.isArray(o.material) ? out : out[0];
  });
  model.position.copy(pos); model.rotation.y = yaw;
  game.scene.add(model);
  const clip = await game.assets.clip(def.gender === 'female' ? 'f' : 'm', 'idle');
  if (clip) {
    for (const t of clip.tracks) if (t.name.endsWith('.position')) { const v = t.values; for (let i = 0; i < v.length; i += 3) { v[i] = 0; v[i + 2] = 0; } }
    const mixer = new THREE.AnimationMixer(model);
    mixer.clipAction(clip).play();
    mixers.push(mixer);
  }
}
if (params.get('avatars') !== '0') {
  const c = arena.court;
  await Promise.all([
    addAvatar('Rayne', c.spawnPoint(TEAM.HOME, 1, 3), c.spawnYaw(TEAM.HOME)),
    addAvatar('Gale', c.spawnPoint(TEAM.HOME, 0, 3).setX(-1.2).setZ(-3.2), c.spawnYaw(TEAM.HOME)),
    addAvatar('Bear', c.spawnPoint(TEAM.AWAY, 1, 3), c.spawnYaw(TEAM.AWAY)),
  ]).catch((e) => console.warn('avatar load failed', e));
  const ballMat = new THREE.MeshPhysicalMaterial({ color: 0xb3130f, roughness: 0.55, sheen: 0.4, sheenColor: new THREE.Color(0.6, 0.2, 0.2) });
  const ballGeo = new THREE.SphereGeometry(0.105, 32, 16);
  for (const p of c.openingBallPositions(6)) {
    const b = new THREE.Mesh(ballGeo, ballMat);
    b.position.copy(p); b.castShadow = true;
    game.scene.add(b);
  }
}

// ---- camera views
const views = ['orbit', 'player', 'side', 'stands', 'end', 'top'];
let view = views.includes(params.get('view')) ? params.get('view') : 'orbit';
const speed = Number(params.get('speed') || 0.06);
const cam = game.camera;
const look = new THREE.Vector3();
game.addSystem({
  update(dt, realDt) {
    const t = game.time.realNow;
    for (const m of mixers) m.update(realDt);
    switch (view) {
      case 'player': cam.position.set(0.9, 2.25, -9.6); look.set(-0.2, 1.3, 3); break;
      case 'side': cam.position.set(12.5, 6.2, -1.5); look.set(0, 0.6, 0); break;
      case 'stands': cam.position.set(-3, 1.8, -4); look.set(14, 4.5, 3); break;
      case 'end': cam.position.set(1.5, 2.4, 14.6); look.set(0, 1.6, -6); break;
      case 'top': cam.position.set(0.01, 30, 0); look.set(0, 0, 0); break;
      default: {
        const a = t * speed + 0.9;
        cam.position.set(Math.sin(a) * 15.5, 6.5 + Math.sin(t * 0.07) * 1.2, Math.cos(a) * 15.5);
        look.set(0, 0.8, 0);
      }
    }
    cam.lookAt(look);
  },
}, 90);

const pulseTypes = ['hit', 'heavyHit', 'perfectCatch', 'ultimate', 'freeze', 'rewind', 'danger'];
addEventListener('keydown', (e) => {
  const i = Number(e.key) - 1;
  if (i >= 0 && i < pulseTypes.length) renderer.pulse(pulseTypes[i], 1, pulseTypes[i] === 'freeze' || pulseTypes[i] === 'rewind' ? 1.5 : 0.35);
  if (e.key === 'v' || e.key === 'V') view = views[(views.indexOf(view) + 1) % views.length];
});
if (params.get('pulse')) setInterval(() => renderer.pulse(params.get('pulse'), 1, 0.6), 2000);
if (params.get('sustain')) renderer.setSustained(params.get('sustain'), 1);

game.start();
const stats = () => ({ ready: true, buildMs, fps: Math.round(game.stats.fps), frameMs: +game.stats.frameMs.toFixed(2), view, arena: arena.stats(), render: renderer.stats() });
setInterval(() => { hud.textContent = JSON.stringify(stats(), null, 1).replace(/[{}"]/g, ''); }, 500);
window.__DU = { ready: true, game, stats };
</script>
</body>
</html>
