<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Character Test</title>
<link rel="icon" href="data:," />
<style>
  :root { --bg: #0d0f12; --fg: #e8e8e8; --panel: rgba(0, 0, 0, .55); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 12px/1.35 system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; left: 10px; top: 10px; background: var(--panel); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
  #err { position: fixed; left: 10px; bottom: 10px; color: #ff8a80; white-space: pre-wrap; max-width: 90vw; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/build/three.module.js",
  "three/addons/": "../vendor/three/examples/jsm/",
  "cannon-es": "../vendor/cannon-es/cannon-es.js"
} }
</script>
</head>
<body>
<div id="hud">loading...</div>
<div id="err"></div>
<script type="module">
// ---------------------------------------------------------------------------------------------------------------
// Developer test bench for js/characters/{avatar,ragdoll}.js. Spawns realistic avatars with FAKE player objects
// (no gameplay modules needed) and scripts them through every feature:
//   A  Rayne   (home, local)  running circles (lean, gait blend, sprint), jump (airborne), charge + whip throw
//   B  Screws  (away)         catch stance, head/hands track an incoming ball, perfect catch absorb, carry, strafe
//   C  Gale    (away)         back-pedal, slide, cloak (enemy of the local player -> shimmer), frozen, afterimages
//   D  Bear    (away)         hit flash + flinch -> ragdoll with impulse -> recover (blend back)
//   E  Houdini (home)         animated clone mirroring the upper body, cheer / wave one-shots, stunned
// URL: ?hero=Elsa (single avatar cycling all features), ?phase=ragdoll|catch|throw|run|frozen|cloak|clone (lock one)
// ---------------------------------------------------------------------------------------------------------------
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { game, ORDER } from '../js/game.js';
import { Assets } from '../js/engine/assets.js';
import { Court } from '../js/world/court.js';
import { TEAM } from '../js/core/constants.js';
import { heroById } from '../js/abilities/roster.js';
import { Physics } from '../js/characters/ragdoll.js';
import { Avatar } from '../js/characters/avatar.js';

const params = new URLSearchParams(location.search);
const errBox = document.getElementById('err');
const errors = [];
const report = (e) => { const m = String(e && (e.stack || e.message) || e); if (errors.includes(m)) return; errors.push(m); console.error('[character-test]', m); errBox.textContent = errors.slice(-4).join('\n'); };
addEventListener('error', (e) => report(e.error || e.message));
addEventListener('unhandledrejection', (e) => report(e.reason));

// ------------------------------------------------------------------ renderer / scene (mirrors the game's look)
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15181d);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.8;
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
const sun = new THREE.DirectionalLight(0xfff4e6, 2.4);
sun.position.set(4, 9, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xdfe8ff, 0x3a2a1a, 0.5));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0xa5764a, roughness: 0.42, metalness: 0 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
// a wall collider for the ragdoll to hit
const wallBox = new THREE.Box3(new THREE.Vector3(6.2, 0, -3), new THREE.Vector3(6.6, 2.5, 5));
const wall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.5, 8), new THREE.MeshStandardMaterial({ color: 0x33414f, roughness: 0.8 }));
wallBox.getCenter(wall.position); wall.receiveShadow = true; wall.castShadow = true; scene.add(wall);

// ------------------------------------------------------------------ minimal game context
game.scene = scene; game.camera = camera;
game.renderer = { three: renderer, scene, camera, render() { renderer.render(scene, camera); }, pulse() {}, setSustained() {} };
game.config = { ...game.config, quality: 'high', noCombatImport: true, params };
game.assets = new Assets(renderer);
game.assets.base = '../assets/';
game.court = new Court();
game.arena = { colliders: [wallBox] };
game.physics = new Physics();
game.addSystem(game.physics, ORDER.PHYSICS);
await game.assets.loadManifest();

// ------------------------------------------------------------------ fake players
const _tmp = new THREE.Vector3();
class FakePlayer {
  constructor(id, heroId, team, pos, yaw = 0, isLocal = false) {
    this.id = id; this.name = heroId; this.team = team; this.hero = heroById(heroId); this.isLocal = isLocal; this.isHuman = isLocal;
    this.zone = 'infield';
    this.root = new THREE.Group(); scene.add(this.root);
    this.root.position.copy(pos);
    this.velocity = new THREE.Vector3();
    this.yaw = yaw;
    this.motor = { planarSpeed: 0, isGrounded: true, isSliding: false };
    this.fsm = { current: 'grounded', incapReason: null };
    this.combat = { isCharging: false, charge: 0, hasBall: false, catchArmed: false, currentTarget: null };
    this.intent = { target: null, aimPoint: new THREE.Vector3() };
    this.status = { has: () => false };
    this.isTargetable = true; this.canReceive = true;
    this.avatar = new Avatar(this);
    this._last = pos.clone();
    game.registerPlayer(this);
  }
  get position() { return this.root.position; }
  /** Moves the root and derives velocity/speed like the real Motor would. */
  moveTo(p, dt, faceTravel = true) {
    if (dt > 0) this.velocity.subVectors(p, this.root.position).divideScalar(dt);
    this.root.position.copy(p);
    this.motor.planarSpeed = Math.hypot(this.velocity.x, this.velocity.z);
    if (faceTravel && this.motor.planarSpeed > 0.3) this.yaw = Math.atan2(this.velocity.x, this.velocity.z);
  }
  stop() { this.velocity.set(0, 0, 0); this.motor.planarSpeed = 0; }
  face(point) { _tmp.subVectors(point, this.root.position); this.yaw = Math.atan2(_tmp.x, _tmp.z); }
}

const single = params.get('hero');
const lock = params.get('phase');
const defs = single ? [[single, TEAM.HOME, new THREE.Vector3(0, 0, 0), 0, true]] : [
  ['Rayne', TEAM.HOME, new THREE.Vector3(-3.2, 0, 0.5), 0, true],
  ['Screws', TEAM.AWAY, new THREE.Vector3(1.2, 0, -1.2), Math.PI * 0.85, false],
  ['Gale', TEAM.AWAY, new THREE.Vector3(-0.6, 0, 2.2), 0, false],
  ['Bear', TEAM.AWAY, new THREE.Vector3(3.8, 0, 1.2), -Math.PI / 2, false],
  ['Houdini', TEAM.HOME, new THREE.Vector3(1.6, 0, 3.4), Math.PI, false],
];
const players = defs.map(([h, t, p, y, l], i) => new FakePlayer(i, h, t, p, y, l));
await Promise.all(players.map((p) => p.avatar.load()));
// player B rotates its own root with the yaw (the avatar must cope with both conventions)
if (players[1]) players[1].rotateRoot = true;

// incoming-ball simulation for the catch IK (the real BallManager exposes the same incomingLive(player, out))
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(0.105, 32, 16), new THREE.MeshPhysicalMaterial({ color: 0xb3161b, roughness: 0.55, clearcoat: 0.3 }));
ballMesh.castShadow = true; scene.add(ballMesh);
const fakeBall = { position: ballMesh.position, velocity: new THREE.Vector3(), live: false, target: null };
game.balls = {
  incomingLive(player, out) {
    if (fakeBall.live && fakeBall.target === player) out.push(fakeBall);
    return out;
  },
};
function launchBall(from, to, speed = 13) {
  ballMesh.removeFromParent(); scene.add(ballMesh);
  fakeBall.position.copy(from);
  fakeBall.velocity.subVectors(to, from).setLength(speed);
  fakeBall.live = true;
}

// ------------------------------------------------------------------ scripts
const A = players[0], Bp = players[1], C = players[2], D = players[3], E = players[4];
let clone = null;
const state = { t: 0 };
const phaseOf = (t, period) => (t % period) / period;
const _p = new THREE.Vector3(), _c = new THREE.Vector3(), _d = new THREE.Vector3();

function scriptRunner(p, t, dt, center) {
  // 0-55% run circles (sprint in the second half), 55-60% jump, 60-80% charge, 80-100% throw + recover
  const ph = phaseOf(t, 7);
  p.combat.isCharging = false;
  if (ph < 0.6 || lock === 'run') {
    const speed = ph < 0.3 ? 4.6 : 7.4;
    p.fsm.current = ph < 0.3 ? 'grounded' : 'sprinting';
    const ang = t * speed / 2.2;
    _p.set(center.x + Math.cos(ang) * 2.2, 0, center.z + Math.sin(ang) * 2.2);
    // jump near the end of the run
    const jumpT = ph - 0.52;
    if (jumpT > 0 && jumpT < 0.08 && lock !== 'run') { const u = jumpT / 0.08; _p.y = 4 * 0.9 * u * (1 - u); p.motor.isGrounded = false; p.fsm.current = 'airborne'; }
    else p.motor.isGrounded = true;
    p.moveTo(_p, dt);
  } else {
    p.motor.isGrounded = true;
    p.fsm.current = 'grounded';
    _p.copy(p.position); _p.y = 0; p.moveTo(_p, dt, false); p.stop();
    const target = Bp || null;
    if (target) { p.face(target.position); p.combat.currentTarget = target; }
    if (ph < 0.8 || lock === 'throw' && ph < 0.9) {
      p.fsm.current = 'chargingThrow';
      p.combat.isCharging = true; p.combat.hasBall = true;
      p.combat.charge = Math.min(1, (ph - 0.6) / 0.12);
      p._thrown = false;
    } else if (!p._thrown) {
      p._thrown = true; p.combat.hasBall = false;
      _d.set(Math.sin(p.yaw), 0.05, Math.cos(p.yaw));
      p.avatar.playThrow(_d);
      if (Bp) { p.avatar.rightHandSocket.getWorldPosition(_c); Bp.avatar.getBonePosition('chest', _p); launchBall(_c, _p, 14); fakeBall.target = Bp; }
    }
  }
}

function scriptCatcher(p, t, dt) {
  // catch stance while a ball is incoming, absorb on contact, carry, then strafe with the ball
  const ph = phaseOf(t, 7);
  p.fsm.current = 'grounded';
  if (fakeBall.live && fakeBall.target === p) {
    p.fsm.current = 'catching'; p.combat.catchArmed = true; p.stop();
    p.face(fakeBall.position);
    p.avatar.rightHandSocket.getWorldPosition(_c);
    p.avatar.getBonePosition('chest', _p);
    fakeBall.position.addScaledVector(fakeBall.velocity, dt);
    if (fakeBall.position.distanceTo(_p) < 0.45) {
      fakeBall.live = false; p.combat.catchArmed = false;
      p.avatar.playCatch(); p.avatar.flash(0xffffff, 0.05);
      p.combat.hasBall = true; p._holdUntil = t + 2.5;
      ballMesh.position.set(0, 0, 0); p.avatar.rightHandSocket.add(ballMesh); // socket check: ball sits in the palm
    }
  } else {
    p.combat.catchArmed = false;
    if (p.combat.hasBall && t > p._holdUntil) { p.combat.hasBall = false; ballMesh.removeFromParent(); scene.add(ballMesh); ballMesh.position.set(0, -5, 0); }
    // strafe sideways (facing stays on player A)
    if (A) p.face(A.position);
    const sway = Math.sin(t * 1.4) * 1.3;
    _p.set(1.2 + sway * Math.cos(p.yaw), 0, -1.2 - sway * Math.sin(p.yaw));
    p.moveTo(_p, dt, false);
    if (lock === 'catch' && !fakeBall.live && A) { A.avatar.rightHandSocket.getWorldPosition(_c); p.avatar.getBonePosition('chest', _p); _p.y += 0.2; launchBall(_c, _p, 11); fakeBall.target = p; }
  }
  if (p.rotateRoot) p.root.rotation.y = p.yaw;
}

function scriptStealth(p, t, dt) {
  // 0-25% back-pedal, 25-35% slide, 35-60% cloak walk, 60-80% frozen, 80-100% sprint with afterimages
  const ph = lock === 'cloak' ? 0.45 : lock === 'frozen' ? 0.7 : phaseOf(t, 8);
  const base = defs[2][2];
  p.fsm.current = 'grounded'; p.motor.isSliding = false;
  p.avatar.setCloaked(ph >= 0.35 && ph < 0.6);
  const frozen = ph >= 0.6 && ph < 0.8;
  if (frozen !== p.avatar.frozen) p.avatar.setFrozen(frozen);
  if (frozen) { p.stop(); return; }
  if (ph < 0.25) {
    p.yaw = 0; // faces +Z (camera) while moving away -> back-pedal
    _p.set(base.x + Math.sin(t * 2.5) * 0.3, 0, base.z - (ph / 0.25) * 2.2);
    p.moveTo(_p, dt, false);
  } else if (ph < 0.35) {
    p.fsm.current = 'sliding'; p.motor.isSliding = true;
    const u = (ph - 0.25) / 0.1;
    _p.set(base.x + u * 2.5, 0, base.z - 2.2); p.moveTo(_p, dt);
  } else if (ph < 0.6) {
    const ang = t * 1.2;
    _p.set(base.x + 1.2 + Math.cos(ang), 0, base.z - 1 + Math.sin(ang)); p.moveTo(_p, dt);
  } else {
    const u = (ph - 0.8) / 0.2;
    _p.set(base.x - 2 + u * 4.5, 0, base.z + 0.8); p.moveTo(_p, dt);
    p.fsm.current = 'sprinting';
    p._ai = (p._ai || 0) - dt;
    if (p._ai <= 0) { p._ai = 0.12; p.avatar.spawnAfterimage(0.6, 0x7a5cff); }
  }
}

function scriptRagdoll(p, t, dt) {
  // hit -> ragdoll -> lie -> recover -> idle
  const period = 6.5;
  const ph = lock === 'ragdoll' ? Math.min(phaseOf(t, period), 0.5) : phaseOf(t, period);
  const cyc = Math.floor(t / period);
  p.stop();
  if (ph < 0.12) { p.fsm.current = 'grounded'; p._hitCycle = p._hitCycle ?? -1; }
  if (ph >= 0.12 && p._hitCycle !== cyc) {
    p._hitCycle = cyc;
    _d.set(-1, 0.15, 0.25).normalize();
    p.avatar.flash(0xffffff, 0.05);
    p.avatar.playHit(_d);
    p._ragAt = t + 0.12;
    p._rag = false;
  }
  if (p._ragAt && t >= p._ragAt && !p._rag) {
    p._rag = true;
    p.fsm.current = 'incapacitated'; p.fsm.incapReason = 'eliminated';
    p.avatar.getBonePosition('chest', _c);
    p.avatar.enableRagdoll(_d.set(-1, 0.1, 0.35).normalize().multiplyScalar(45), _c); // ~150 km/h hit (Health scale)
  }
  if (p._rag && ph > 0.8) {
    p._rag = false; p._ragAt = 0;
    p.fsm.current = 'grounded'; p.fsm.incapReason = null;
    p.avatar.recoverFromRagdoll();
  }
}

function scriptClone(p, t, dt) {
  const ph = lock === 'clone' ? 0.1 : phaseOf(t, 9);
  p.stop();
  if (!clone && p.avatar.loaded) clone = p.avatar.createClone();
  if (clone) {
    // clone walks a small circle next to the source (own gait), mirrors throws/catches of the source's upper body
    const ang = t * 0.9;
    clone.followYaw = false;
    clone.root.position.set(p.position.x - 1.6 + Math.cos(ang) * 0.7, 0, p.position.z + Math.sin(ang) * 0.7);
    clone.root.rotation.y = ang + Math.PI;
  }
  p.combat.isCharging = false;
  p.fsm.current = 'grounded';
  if (ph < 0.3) { p.fsm.current = 'chargingThrow'; p.combat.isCharging = true; p.combat.charge = Math.min(1, ph / 0.2); p.combat.hasBall = true; p._thrown = false; }
  else if (!p._thrown) { p._thrown = true; p.combat.hasBall = false; p.avatar.playThrow(_d.set(0, 0, -1)); }
  else if (ph > 0.4 && ph < 0.42 && !p._cheered) { p._cheered = true; p.avatar.cheer(); }
  else if (ph > 0.75 && ph < 0.95) { p.fsm.current = 'stunned'; }
  if (ph < 0.1) p._cheered = false;
}

const driver = {
  update(dt, realDt) {
    state.t += dt;
    const t = state.t;
    try {
      if (single) {
        const p = A;
        const cyc = Math.floor(t / 7) % 3;
        if (cyc === 0) scriptRunner(p, t, dt, new THREE.Vector3(0, 0, 0));
        else if (cyc === 1) scriptStealth(p, t, dt);
        else scriptRagdoll(p, t, dt);
      } else {
        if (A) scriptRunner(A, t, dt, defs[0][2]);
        if (Bp) scriptCatcher(Bp, t, dt);
        if (C) scriptStealth(C, t, dt);
        if (D) scriptRagdoll(D, t, dt);
        if (E) scriptClone(E, t, dt);
      }
      if (fakeBall.live && !(Bp && fakeBall.target === Bp)) fakeBall.position.addScaledVector(fakeBall.velocity, dt);
      for (const p of players) p.avatar.update(dt, realDt);
    } catch (e) { report(e); }
  },
  lateUpdate(dt, realDt) {
    // camera: wide shot of the bench (or a close orbit in single mode)
    if (single) { const a = state.t * 0.25; camera.position.set(Math.sin(a) * 5, 2.1, Math.cos(a) * 5); camera.lookAt(0, 1, 0); }
    else { camera.position.set(0.5, 2.5, 8.6); camera.lookAt(0.5, 0.95, 0.9); }
    hud.textContent = players.map((p) => {
      const av = p.avatar;
      const top = Object.entries(av._w).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k, w]) => `${k}:${w.toFixed(2)}`).join(' ');
      return `${p.name.padEnd(8)} ${p.fsm.current.padEnd(14)} ${av.isRagdoll ? 'RAGDOLL ' : ''}${av.frozen ? 'FROZEN ' : ''}${av.cloaked ? 'CLOAK ' : ''}v=${p.motor.planarSpeed.toFixed(1)} ${top}`;
    }).join('\n') + `\nfps ${game.stats.fps.toFixed(0)}  physics steps ${game.physics.steps}  draw ${renderer.info.render.calls}`;
  },
};
const hud = document.getElementById('hud');
game.addSystem(driver, ORDER.PLAYERS);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
game.start();

window.__DU = {
  ready: true,
  game,
  stats: () => ({
    fps: Math.round(game.stats.fps), errors,
    physicsSteps: game.physics.steps, activeRagdolls: game.physics.activeCount,
    avatars: players.map((p) => ({
      hero: p.avatar.heroId, loaded: p.avatar.loaded, ragdoll: p.avatar.isRagdoll, frozen: p.avatar.frozen, cloaked: p.avatar.cloaked,
      scale: +p.avatar.worldScale.toFixed(3), afterimages: p.avatar._afterimages.length, clones: p.avatar._clones.size,
      weights: Object.fromEntries(Object.entries(p.avatar._w).filter(([, w]) => w > 0.01).map(([k, w]) => [k, +w.toFixed(2)])),
      hips: p.avatar.hipsPosition(new THREE.Vector3()).toArray().map((v) => +v.toFixed(2)),
    })),
    draw: renderer.info.render,
  }),
};
</script>
</body>
</html>
